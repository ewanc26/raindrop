# You can obtain one at http://mozilla.org/MPL/2.0/.
#
# Issue #11: prove that a packaged Windows build actually ships raindrop's
# branding resources. This is an artifact build, so compiled C++ comes from the
# signed Firefox release revision in sourcestamp.txt; the UI resources,
# preferences and installer resources under test are built from this tree.
#
# Unlike the self-hosted stock build in build-bootstrap.yml, this runs on an
# ephemeral hosted runner and may use `pull_request`: it needs no secrets and
# executes the PR's own workflow so the gate can be verified before merge.

name: Windows package check

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-package-check-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  package:
    runs-on: windows-latest
    steps:
      - name: Check out raindrop source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install MozillaBuild
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $ProgressPreference = "SilentlyContinue"
          $url = "https://ftp.mozilla.org/pub/mozilla/libraries/win32/MozillaBuildSetup-4.2.1.exe"
          $installer = Join-Path $env:RUNNER_TEMP "MozillaBuildSetup-4.2.1.exe"
          Invoke-WebRequest -Uri $url -OutFile $installer
          $hash = (Get-FileHash -Algorithm SHA256 -Path $installer).Hash.ToLowerInvariant()
          $expected = "8ef5b3d2087e4867dc75bf19f5e62f12e917f518239415723cc70896b6f1e3d8"
          if ($hash -ne $expected) {
            throw "MozillaBuild SHA-256 mismatch: $hash"
          }
          $process = Start-Process -FilePath $installer -ArgumentList "/S" -Wait -PassThru
          if ($process.ExitCode -ne 0) {
            throw "MozillaBuild installer exited with $($process.ExitCode)"
          }
          if (-not (Test-Path "C:\mozilla-build\msys2\msys2_shell.cmd")) {
            throw "MozillaBuild did not install to C:\mozilla-build"
          }

      - name: Install Mozilla's signed NSIS package
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $ProgressPreference = "SilentlyContinue"
          $url = "https://github.com/mozilla-releng/adhoc-signing-blobs/raw/nsis/nsis-3.07-signed.zip"
          $archive = Join-Path $env:RUNNER_TEMP "nsis-3.07-signed.zip"
          Invoke-WebRequest -Uri $url -OutFile $archive
          $hash = (Get-FileHash -Algorithm SHA256 -Path $archive).Hash.ToLowerInvariant()
          $expected = "5856cd49b52870caa41814d71ce30c4304d5001b80c04f4eb7028ffedd91df7e"
          if ($hash -ne $expected) {
            throw "NSIS SHA-256 mismatch: $hash"
          }
          $extract = Join-Path $env:RUNNER_TEMP "nsis-extract"
          if (Test-Path $extract) {
            Remove-Item -Recurse -Force $extract
          }
          Expand-Archive -Path $archive -DestinationPath $extract
          $destination = Join-Path $env:USERPROFILE ".mozbuild\nsis"
          New-Item -ItemType Directory -Force -Path $destination | Out-Null
          Copy-Item -Path (Join-Path $extract "nsis-3.07\*") -Destination $destination -Recurse -Force
          if (-not (Test-Path (Join-Path $destination "bin\makensis.exe"))) {
            throw "Pinned NSIS package did not provide makensis.exe"
          }

      - name: Derive pinned artifact revision
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $sourceLine = (Get-Content sourcestamp.txt -TotalCount 2)[1]
          $revision = ($sourceLine -split '/')[-1].Trim()
          if ($revision -notmatch '^[0-9a-f]{40}$') {
            throw "sourcestamp.txt does not contain a 40-hex release revision: $sourceLine"
          }
          "MOZ_ARTIFACT_REVISION=$revision" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "Using Firefox artifacts from $revision"

      - name: Build and package raindrop
        shell: pwsh
        env:
          MOZCONFIG: ${{ github.workspace }}/build/raindrop-windows-artifact.mozconfig
        run: |
          $ErrorActionPreference = "Stop"
          # MozillaBuild supplies sh/awk/NSIS; use the setup-python interpreter.
          $env:PATH = "C:\mozilla-build\bin;$env:PATH"
          python .\mach build
          python .\mach package

      - name: Capture installer version resources
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $dist = Join-Path $env:GITHUB_WORKSPACE "obj-raindrop-win-artifact\dist"
          $installer = Get-ChildItem -Path $dist -Filter "*.installer.exe" | Select-Object -First 1
          if (-not $installer) {
            throw "No Windows installer executable was produced"
          }
          $helper = Join-Path $dist "bin\uninstall\helper.exe"
          if (-not (Test-Path $helper)) {
            throw "No uninstaller helper was produced"
          }
          function Get-VersionInfo([string] $Path) {
            $info = [System.Diagnostics.FileVersionInfo]::GetVersionInfo($Path)
            return [ordered]@{
              ProductName      = $info.ProductName
              ProductVersion   = $info.ProductVersion
              FileDescription  = $info.FileDescription
              CompanyName      = $info.CompanyName
              LegalCopyright   = $info.LegalCopyright
              OriginalFilename = $info.OriginalFilename
            }
          }
          $result = [ordered]@{
            installer = Get-VersionInfo $installer.FullName
            helper    = Get-VersionInfo $helper
          }
          $result | ConvertTo-Json -Depth 4 | Set-Content `
            -Path (Join-Path $dist "installer-version-info.json") -Encoding UTF8

      - name: Inspect packaged resources
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          python tools/raindrop/check_windows_package.py `
            --objdir obj-raindrop-win-artifact `
            --version-info obj-raindrop-win-artifact/dist/installer-version-info.json

      - name: Upload Windows packages
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-package
          path: |
            obj-raindrop-win-artifact/dist/*.zip
            obj-raindrop-win-artifact/dist/*.installer.exe
            obj-raindrop-win-artifact/dist/installer-version-info.json
            obj-raindrop-win-artifact/instgen/defines.nsi
          if-no-files-found: ignore
