#
# Issue #65: the dependency-free tests guard the fork's rebase-sensitive
# behaviour on every pull request, not just at release time.

name: Offline suite

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: offline-suite-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  unittest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify AT Protocol setup wiring
        run: python3 tools/raindrop/verify_atproto_setup.py

      - name: Run offline tests
        run: python3 -m unittest discover -s tools/raindrop/tests
